<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>KRW Marketing Solutions</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#f4f4f4; min-height:100vh; }
  .page-wrap{ max-width:680px; margin:0 auto; padding:16px; }
  .form-header{ background:#1a2744; color:#fff; border-radius:10px 10px 0 0; padding:24px 28px; }
  .form-header h1{ font-size:20px; font-weight:700; margin-bottom:4px; }
  .form-header p{ font-size:13px; opacity:.75; }
  .form-card{ background:#fff; border-radius:0 0 10px 10px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  .section-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:#888; margin:20px 0 10px; padding-bottom:6px; border-bottom:1px solid #eee; }
  .form-group{ margin-bottom:14px; }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group label{ display:block; font-size:11px; font-weight:600; color:#444; margin-bottom:5px; }
  .form-group label .req{ color:#e53e3e; margin-left:2px; }
  .form-group input, .form-group select{
    width:100%; padding:9px 12px; border:1px solid #ddd; border-radius:6px;
    font-size:14px; color:#222; background:#fff; transition:border-color .15s;
  }
  .form-group input:focus, .form-group select:focus{ outline:none; border-color:#3b6fd4; box-shadow:0 0 0 3px rgba(59,111,212,.1); }
  .submit-btn{
    width:100%; padding:13px; background:#1a2744; color:#fff; border:none;
    border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:20px;
    transition:background .15s;
  }
  .submit-btn:hover{ background:#243a6a; }
  .submit-btn:disabled{ background:#aaa; cursor:not-allowed; }
  .result{ padding:12px 16px; border-radius:6px; font-size:13px; margin-top:14px; display:none; }
  .result.error{ background:#fff5f5; border:1px solid #fc8181; color:#c53030; }
  .result.success{ background:#f0fff4; border:1px solid #68d391; color:#276749; }
  /* States */
  #state-loading{ text-align:center; padding:48px 0; color:#888; font-size:14px; }
  #state-error{ background:#fff5f5; border:1px solid #fc8181; border-radius:8px; padding:20px 24px; color:#c53030; }
  #state-error h3{ font-size:15px; margin-bottom:6px; }
  #state-success{ background:#f0fff4; border:1px solid #68d391; border-radius:8px; padding:28px; text-align:center; }
  #state-success h2{ color:#276749; font-size:20px; margin-bottom:8px; }
  #state-success p{ color:#555; font-size:14px; }
  #lead-form{ display:none; }
  .spinner{ display:inline-block; width:18px; height:18px; border:2px solid #ccc; border-top-color:#1a2744; border-radius:50%; animation:spin .7s linear infinite; margin-right:8px; vertical-align:middle; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @media(max-width:500px){ .form-row{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="form-header">
    <h1>KRW Marketing Solutions</h1>
    <p id="form-subtitle">Lead Submission Form</p>
  </div>
  <div class="form-card">

    <!-- Loading -->
    <div id="state-loading"><span class="spinner"></span> Loading form...</div>

    <!-- Error -->
    <div id="state-error" style="display:none">
      <h3>⚠️ Campaign not found</h3>
      <p id="error-msg"></p>
    </div>

    <!-- Form -->
    <form id="lead-form" onsubmit="submitLead(event)">
      <div id="form-fields"></div>
      <button type="submit" class="submit-btn" id="submit-btn">Submit Lead</button>
      <div class="result" id="result-msg"></div>
    </form>

    <!-- Success -->
    <div id="state-success" style="display:none">
      <h2>✅ Lead Submitted</h2>
      <p>Reference ID: <strong id="success-id"></strong></p>
      <p style="margin-top:8px;font-size:13px;color:#888;">Thank you. Your lead has been received.</p>
    </div>

  </div>
</div>

<script>
  var API_BASE = 'https://krw-backend-production.up.railway.app';
  var API_KEY  = 'krwleads2026secure';

  var params    = new URLSearchParams(window.location.search);
  var campaign  = (params.get('campaign') || '').toLowerCase().trim();
  var pubSub    = params.get('sub') || params.get('publisher_sub') || '';

  var campaignConfig = null;

  // ── Field type map ─────────────────────────────────────
  var FIELD_TYPES = {
    firstName:'text', lastName:'text', email:'email', phone:'tel',
    dateOfBirth:'date', street:'text', city:'text', zip:'text',
    zipcode:'text', notes:'textarea', trustedFormCertUrl:'text',
    jornayaLeadId:'text', publisherSub:'text', websource:'text',
    ipAddress:'text', incidentDate:'text', incidentStateText:'text',
    // dropdowns
    state:'state_select', incidentState:'state_select',
    gender:'select', driverOrPassenger:'select', abuseType:'select',
    hasReceipt:'select', fraudConviction:'select', haveAttorney:'select',
    usedRoundup:'select', rideshareGender:'select', sexuallyAssaulted:'select',
    rideshareCompany:'select', reportedTo:'select', bestTimeToCall:'select',
    whichCancer:'select', whatYear:'select', exposedLocation:'select',
  };

  // ── Field label map ────────────────────────────────────
  var FIELD_LABELS = {
    firstName:'First Name', lastName:'Last Name', email:'Email Address',
    phone:'Phone Number', dateOfBirth:'Date of Birth', street:'Street Address',
    city:'City', state:'State', zip:'Zip Code', zipcode:'Zip Code',
    notes:'Additional Notes', trustedFormCertUrl:'TrustedForm Certificate URL',
    jornayaLeadId:'Jornaya Lead ID', publisherSub:'Publisher Sub ID',
    websource:'Landing Page URL', ipAddress:'IP Address',
    incidentState:'State of Incident', incidentDate:'Date Incident Occurred (MM/DD/YYYY)',
    incidentStateText:'State Where Incident Occurred',
    gender:'Gender', rideshareGender:'What Is Your Gender?',
    sexuallyAssaulted:'Were You Sexually Assaulted by a Rideshare Driver?',
    rideshareCompany:'Rideshare Company (Uber or Lyft)',
    driverOrPassenger:'Were You the Driver or Passenger?',
    abuseType:'What Type of Abuse Did You Experience?',
    hasReceipt:'Do You Have a Rideshare Receipt?',
    fraudConviction:'Have You Ever Been Convicted for Fraud?',
    reportedTo:'Who Was the Incident Reported To?',
    bestTimeToCall:'Best Time to Reach You?',
    haveAttorney:'Do You Currently Have an Attorney?',
    usedRoundup:'Were You Exposed to Roundup Herbicide?',
    whichCancer:'Cancer Diagnosis',
    whatYear:'Year Diagnosed',
    exposedLocation:'Where Were You Primarily Exposed?',
  };

  var US_STATES = [
    ['','-- Select State --'],
    ['AL','Alabama'],['AK','Alaska'],['AZ','Arizona'],['AR','Arkansas'],
    ['CA','California'],['CO','Colorado'],['CT','Connecticut'],['DE','Delaware'],
    ['FL','Florida'],['GA','Georgia'],['HI','Hawaii'],['ID','Idaho'],
    ['IL','Illinois'],['IN','Indiana'],['IA','Iowa'],['KS','Kansas'],
    ['KY','Kentucky'],['LA','Louisiana'],['ME','Maine'],['MD','Maryland'],
    ['MA','Massachusetts'],['MI','Michigan'],['MN','Minnesota'],['MS','Mississippi'],
    ['MO','Missouri'],['MT','Montana'],['NE','Nebraska'],['NV','Nevada'],
    ['NH','New Hampshire'],['NJ','New Jersey'],['NM','New Mexico'],['NY','New York'],
    ['NC','North Carolina'],['ND','North Dakota'],['OH','Ohio'],['OK','Oklahoma'],
    ['OR','Oregon'],['PA','Pennsylvania'],['RI','Rhode Island'],['SC','South Carolina'],
    ['SD','South Dakota'],['TN','Tennessee'],['TX','Texas'],['UT','Utah'],
    ['VT','Vermont'],['VA','Virginia'],['WA','Washington'],['WV','West Virginia'],
    ['WI','Wisconsin'],['WY','Wyoming'],['DC','District of Columbia'],
  ];

  // ── Build a single field ───────────────────────────────
  function buildField(name, required, cfg) {
    var wrap  = document.createElement('div');
    wrap.className = 'form-group';

    var label = document.createElement('label');
    label.htmlFor = 'field-' + name;
    var labelText = (cfg.field_labels && cfg.field_labels[name]) || FIELD_LABELS[name] || name;
    label.innerHTML = labelText + (required ? '<span class="req">*</span>' : '');
    wrap.appendChild(label);

    var type  = FIELD_TYPES[name] || 'text';
    var input;

    if (type === 'textarea') {
      input = document.createElement('textarea');
      input.rows = 3;
      input.style.cssText = 'width:100%;padding:9px 12px;border:1px solid #ddd;border-radius:6px;font-size:14px;resize:vertical;';

    } else if (type === 'state_select') {
      input = document.createElement('select');
      US_STATES.forEach(function(s){
        var o = document.createElement('option'); o.value = s[0]; o.textContent = s[1]; input.appendChild(o);
      });

    } else if (name === 'rideshareGender') {
      input = document.createElement('select');
      [['','-- Select --'],['938095','Female'],['938096','Male (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'sexuallyAssaulted') {
      input = document.createElement('select');
      [['','-- Select --'],['938097','Yes'],['938098','No (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'rideshareCompany') {
      input = document.createElement('select');
      [['','-- Select --'],['938043','Uber'],['938042','Lyft'],['938044','Other (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'driverOrPassenger') {
      input = document.createElement('select');
      [['','-- Select --'],['938060','Passenger'],['938061','Driver (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'abuseType') {
      input = document.createElement('select');
      [['','-- Select --'],['938062','Sexual Assault'],['938063','Sexual Harassment'],['938064','Unwanted Touching'],['938065','Other']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'hasReceipt') {
      input = document.createElement('select');
      [['','-- Select --'],['938099','Yes'],['938100','No']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'fraudConviction') {
      input = document.createElement('select');
      [['','-- Select --'],['938102','No'],['938101','Yes (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'reportedTo') {
      input = document.createElement('select');
      [['','-- Select --'],['1236409','No One'],['1236407','Police'],['1236406','Medical Professional'],['1236405','Rideshare Company'],['1236408','Therapist'],['1236404','Family / Friends']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'bestTimeToCall') {
      input = document.createElement('select');
      [['','-- Select --'],['295473','Anytime'],['295470','Morning'],['295471','Afternoon'],['295472','Evening']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'gender') {
      input = document.createElement('select');
      [['','-- Select --'],['Male','Male'],['Female','Female'],['Other','Other']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'haveAttorney') {
      input = document.createElement('select');
      [['','-- Select --'],['Yes','Yes (Disqualifies)'],['No','No']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'usedRoundup') {
      input = document.createElement('select');
      [['','-- Select --'],['Yes','Yes'],['No','No (Disqualifies)']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'whichCancer') {
      input = document.createElement('select');
      [['','-- Select --'],['B-Cell Lymphoma','B-Cell Lymphoma'],['Non-Hodgkin\'s Lymphoma','Non-Hodgkin\'s Lymphoma'],['T-Cell Lymphoma','T-Cell Lymphoma'],['Other Lymphoma','Other Lymphoma']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'whatYear') {
      input = document.createElement('select');
      [['','-- Select --'],['2020 or After','2020 or After'],['2015-2019','2015-2019'],['2010-2014','2010-2014'],['Before 2010','Before 2010']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else if (name === 'exposedLocation') {
      input = document.createElement('select');
      [['','-- Select --'],['Work','Work'],['Home','Home'],['Farm','Farm'],['Golf Course','Golf Course'],['Other','Other']].forEach(function(v){
        var o=document.createElement('option');o.value=v[0];o.textContent=v[1];input.appendChild(o);
      });

    } else {
      input = document.createElement('input');
      input.type = type;
    }

    input.id   = 'field-' + name;
    input.name = name;
    if (required) input.required = true;
    if (name === 'publisherSub' && pubSub) { input.value = pubSub; input.readOnly = true; }
    wrap.appendChild(input);
    return wrap;
  }

  // ── Build the full form from campaign config ───────────
  function buildForm(cfg) {
    document.getElementById('form-subtitle').textContent =
      (cfg.name || campaign) + ' — Lead Submission';

    var container = document.getElementById('form-fields');
    container.innerHTML = '';

    var required = cfg.required_fields || cfg.required || [];
    var optional = cfg.optional_fields || cfg.optional || [];

    // Required section
    if (required.length) {
      var sec = document.createElement('div');
      sec.className = 'section-label';
      sec.textContent = 'Required Information';
      container.appendChild(sec);

      // Pair first/last and email/phone side by side
      var paired = [];
      var pairs  = [['firstName','lastName'],['email','phone']];
      pairs.forEach(function(p){
        if (required.includes(p[0]) && required.includes(p[1])) {
          var row = document.createElement('div');
          row.className = 'form-row';
          row.appendChild(buildField(p[0], true, cfg));
          row.appendChild(buildField(p[1], true, cfg));
          container.appendChild(row);
          paired.push(p[0]); paired.push(p[1]);
        }
      });
      required.forEach(function(name){
        if (!paired.includes(name)) container.appendChild(buildField(name, true, cfg));
      });
    }

    // Optional section
    if (optional.length) {
      var sec2 = document.createElement('div');
      sec2.className = 'section-label';
      sec2.textContent = 'Optional Information';
      container.appendChild(sec2);
      optional.forEach(function(name){
        container.appendChild(buildField(name, false, cfg));
      });
    }

    document.getElementById('state-loading').style.display = 'none';
    document.getElementById('lead-form').style.display     = '';
  }

  // ── Submit lead ────────────────────────────────────────
  async function submitLead(e) {
    e.preventDefault();
    var btn    = document.getElementById('submit-btn');
    var result = document.getElementById('result-msg');
    result.style.display = 'none';
    result.className     = 'result';

    // Build data object from all form fields
    var data = {};
    var cfg  = campaignConfig;
    var required = cfg.required_fields || cfg.required || [];
    var optional = cfg.optional_fields || cfg.optional || [];
    required.concat(optional).forEach(function(name){
      var el = document.getElementById('field-' + name);
      if (el) data[name] = el.value;
    });

    // Always include publisherSub
    data.publisherSub = pubSub || data.publisherSub || '';

    // Validate required
    var missing = required.filter(function(name){
      return !data[name] || !String(data[name]).trim();
    });
    if (missing.length) {
      result.className     = 'result error';
      result.textContent   = 'Please fill in all required fields: ' + missing.map(function(n){ return FIELD_LABELS[n]||n; }).join(', ');
      result.style.display = '';
      return;
    }

    // Clean phone
    if (data.phone) data.phone = data.phone.replace(/\D/g, '');

    btn.disabled    = true;
    btn.textContent = 'Submitting...';

    try {
      var res = await fetch(API_BASE + '/lead/' + campaign, {
        method:  'POST',
        headers: { 'Content-Type':'application/json', 'x-api-key': API_KEY },
        body:    JSON.stringify(data),
      });
      var d = await res.json();

      if (d.status === 'received' || d.ok || res.ok) {
        document.getElementById('lead-form').style.display     = 'none';
        document.getElementById('state-success').style.display = '';
        document.getElementById('success-id').textContent      = d.leadId || d.id || '';
      } else {
        throw new Error(d.reason || d.error || 'Submission failed');
      }
    } catch(err) {
      result.className     = 'result error';
      result.textContent   = 'Error: ' + err.message + '. Please try again.';
      result.style.display = '';
      btn.disabled         = false;
      btn.textContent      = 'Submit Lead';
    }
  }

  // ── Load campaign config ───────────────────────────────
  async function init() {
    if (!campaign) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display   = '';
      document.getElementById('error-msg').textContent        = 'No campaign specified in URL. Add ?campaign=SLUG to the URL.';
      return;
    }
    try {
      var res = await fetch(API_BASE + '/campaigns/' + campaign + '/config');
      if (!res.ok) throw new Error('HTTP ' + res.status + '. Check the campaign parameter in the URL.');
      var cfg = await res.json();
      // FIX: check for actual error/missing data, not cfg.ok (endpoint returns raw row)
      if (cfg.error || (!cfg.slug && !cfg.id)) {
        throw new Error(cfg.error || 'Campaign not found: ' + campaign);
      }
      campaignConfig = cfg;
      buildForm(cfg);
    } catch(err) {
      document.getElementById('state-loading').style.display = 'none';
      document.getElementById('state-error').style.display   = '';
      document.getElementById('error-msg').textContent        = err.message;
    }
  }

  init();
</script>
</body>
</html>
